name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck get-kira.sh scripts/*.sh launchers/kirakit-session
      # team is a template: check it as built, with every member.
      - run: |
          sh scripts/build.sh -o "$RUNNER_TEMP/build" --analyst
          shellcheck "$RUNNER_TEMP/build/bin/team"

  psscriptanalyzer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze get-kira.ps1
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $results = Invoke-ScriptAnalyzer -Path get-kira.ps1 -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize
          if ($results) { exit 1 }

  sh:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: dash
          - os: ubuntu-latest
            shell: bash --posix
          - os: macos-latest
            shell: sh
          - os: macos-latest
            shell: zsh --emulate sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Dry run
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude
        run: ${{ matrix.shell }} ./get-kira.sh --dry-run --name CI --gender unspecified --language auto --no-co-author
      - name: End-to-end tests
        run: sh scripts/test.sh '${{ matrix.shell }}'

  powershell:
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    runs-on: windows-latest
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Dry run
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}\claude
        run: ./get-kira.ps1 -DryRun -Name CI -Gender unspecified -Language auto -NoCoAuthor
      - name: Install, rerun, uninstall
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}\claude
        run: |
          $install = ./get-kira.ps1 -Name CI -Gender female -Language French -CoAuthor 'Kira <kira@example.com>' *>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Host $install; exit 1 }
          if (-not $install.Contains('not supported on Windows')) { throw "no launchers notice:`n$install" }
          $launchers = ./get-kira.ps1 -Only launchers *>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Host $launchers; exit 1 }
          if (-not $launchers.Contains('not supported on Windows')) { throw "no launchers notice with -Only launchers:`n$launchers" }
          $styles = Join-Path $env:CLAUDE_CONFIG_DIR 'output-styles'
          if (-not (Test-Path (Join-Path $styles 'kira-cozy.md'))) { throw 'styles not installed' }
          $settings = Get-Content (Join-Path $env:CLAUDE_CONFIG_DIR 'settings.json') -Raw
          if (-not $settings.Contains('"outputStyle": "Kira (cozy)"')) { throw 'outputStyle not set' }
          if (-not $settings.Contains('"attribution": {"commit": "", "pr": ""}')) { throw 'attribution not set' }
          $rerun = ./get-kira.ps1 *>&1 | Out-String
          if ($rerun -match 'kirakit: (copy|link|backup|set|save)') { throw "rerun changed files:`n$rerun" }
          ./get-kira.ps1 -Uninstall
          if (Test-Path (Join-Path $styles 'kira-cozy.md')) { throw 'uninstall left styles' }
      - name: Fetch without a clone
        run: ./scripts/test.ps1

  parity:
    # get-kira.ps1 reimplements the build: its output must match build.sh byte for byte.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install with both installers
        run: |
          CLAUDE_CONFIG_DIR="$RUNNER_TEMP/sh" sh get-kira.sh --copy --name Alex --gender female \
            --language French --co-author 'Kira <kira@example.com>'
          CLAUDE_CONFIG_DIR="$RUNNER_TEMP/ps" pwsh -File get-kira.ps1 -Copy -Name Alex -Gender female \
            -Language French -CoAuthor 'Kira <kira@example.com>'
          CLAUDE_CONFIG_DIR="$RUNNER_TEMP/sh-assistant" sh get-kira.sh --copy --name Alex --gender male \
            --language auto --assistant 'Kira <kira@example.com>' --assistant-github kira-bot --no-co-author
          CLAUDE_CONFIG_DIR="$RUNNER_TEMP/ps-assistant" pwsh -File get-kira.ps1 -Copy -Name Alex -Gender male \
            -Language auto -Assistant 'Kira <kira@example.com>' -AssistantGithub kira-bot -NoCoAuthor
          CLAUDE_CONFIG_DIR="$RUNNER_TEMP/sh-analyst" sh get-kira.sh --copy --name Alex --gender female \
            --language auto --assistant 'Kira <kira@example.com>' --analyst-github iris-bot
          CLAUDE_CONFIG_DIR="$RUNNER_TEMP/ps-analyst" pwsh -File get-kira.ps1 -Copy -Name Alex -Gender female \
            -Language auto -Assistant 'Kira <kira@example.com>' -AnalystGithub iris-bot
          grep -qx 'analyst=yes' "$RUNNER_TEMP/ps-analyst/.kirakit-profile"
          CLAUDE_CONFIG_DIR="$RUNNER_TEMP/sh-coder" sh get-kira.sh --copy --name Alex --gender female \
            --language auto --assistant 'Kira <kira@example.com>' --coder 'Cleo <cleo@example.com>' \
            --coder-signing-key /keys/cleo.pub --coder-github cleo-bot
          CLAUDE_CONFIG_DIR="$RUNNER_TEMP/ps-coder" pwsh -File get-kira.ps1 -Copy -Name Alex -Gender female \
            -Language auto -Assistant 'Kira <kira@example.com>' -Coder 'Cleo <cleo@example.com>' \
            -CoderSigningKey /keys/cleo.pub -CoderGithub cleo-bot
          grep -qx 'coder=Cleo <cleo@example.com>' "$RUNNER_TEMP/ps-coder/.kirakit-profile"
          grep -qx 'coder_github=cleo-bot' "$RUNNER_TEMP/ps-coder/.kirakit-profile"
          # The whole team with verified specifications started by the lead (#185 R4, R18).
          CLAUDE_CONFIG_DIR="$RUNNER_TEMP/sh-verified" sh get-kira.sh --copy --name Alex --gender female \
            --language auto --assistant 'Kira <kira@example.com>' --assistant-github kira-bot \
            --analyst-github iris-bot --coder 'Cleo <cleo@example.com>' --coder-github cleo-bot \
            --start-verified-specs
          CLAUDE_CONFIG_DIR="$RUNNER_TEMP/ps-verified" pwsh -File get-kira.ps1 -Copy -Name Alex -Gender female \
            -Language auto -Assistant 'Kira <kira@example.com>' -AssistantGithub kira-bot \
            -AnalystGithub iris-bot -Coder 'Cleo <cleo@example.com>' -CoderGithub cleo-bot \
            -StartVerifiedSpecs
          grep -qx 'start_verified_specs=yes' "$RUNNER_TEMP/ps-verified/.kirakit-profile"
          # The coder's keys are reloaded on the next run, and asked for no more.
          rerun=$(CLAUDE_CONFIG_DIR="$RUNNER_TEMP/ps-coder" pwsh -File get-kira.ps1 -Copy </dev/null)
          printf '%s\n' "$rerun" | grep -F 'coder Cleo <cleo@example.com>'
          ! printf '%s\n' "$rerun" | grep -F 'no terminal to ask for'
          # A profile saved before the coder reads as having none, and asks nothing.
          mkdir -p "$RUNNER_TEMP/ps-earlier"
          printf 'name=Alex\ngender=male\nlanguage=auto\nassistant_name=Kira\nassistant_email=kira@example.com\nassistant_signing_key=\nassistant_github=\nco_author_trailer=yes\nanalyst=no\nanalyst_github=\nstyle=kira-cozy\n' \
            >"$RUNNER_TEMP/ps-earlier/.kirakit-profile"
          earlier=$(CLAUDE_CONFIG_DIR="$RUNNER_TEMP/ps-earlier" pwsh -File get-kira.ps1 -Copy </dev/null)
          ! printf '%s\n' "$earlier" | grep -F 'no terminal to ask for'
          grep -qx 'coder=' "$RUNNER_TEMP/ps-earlier/.kirakit-profile"
          # Invalid values are refused.
          ! CLAUDE_CONFIG_DIR="$RUNNER_TEMP/ps-bad" pwsh -File get-kira.ps1 -DryRun -Coder Cleo
          ! CLAUDE_CONFIG_DIR="$RUNNER_TEMP/ps-bad" pwsh -File get-kira.ps1 -DryRun -CoderGithub 'a/b'
          CLAUDE_CONFIG_DIR="$RUNNER_TEMP/sh-generic" sh get-kira.sh --copy </dev/null
          CLAUDE_CONFIG_DIR="$RUNNER_TEMP/ps-generic" pwsh -File get-kira.ps1 -Copy </dev/null
      - name: Same release tag picked without a clone
        run: |
          remote=$RUNNER_TEMP/remote
          git init -q -b main "$remote"
          cp -r personas team scripts claude github get-kira.sh get-kira.ps1 "$remote/"
          git -C "$remote" add -A
          git -C "$remote" -c user.name=ci -c user.email=ci@example.com commit -q -m ci
          for tag in v0.9.0 v0.10.0 v0.2.1; do git -C "$remote" tag "$tag"; done
          export KIRAKIT_REPO="file://$remote" CLAUDE_CONFIG_DIR="$RUNNER_TEMP/ref"
          profile='-Name A -Gender male -Language auto -NoCoAuthor'
          sh -s -- --dry-run --name A --gender male --language auto --no-co-author <get-kira.sh |
            grep -F '(v0.10.0)'
          pwsh -Command "& ([scriptblock]::Create((Get-Content -Raw ./get-kira.ps1))) -DryRun $profile" |
            grep -F '(v0.10.0)'
      - name: Compare
        run: |
          for pair in sh:ps sh-assistant:ps-assistant sh-analyst:ps-analyst sh-generic:ps-generic sh-coder:ps-coder \
            sh-verified:ps-verified; do
            a=$RUNNER_TEMP/${pair%%:*} b=$RUNNER_TEMP/${pair##*:}
            for path in output-styles skills rules CLAUDE.md settings.json; do
              diff -r "$a/$path" "$b/$path"
            done
            # Agents exist only for some profiles (Iris with an analyst); both or neither.
            if [ -e "$a/agents" ] || [ -e "$b/agents" ]; then diff -r "$a/agents" "$b/agents"; fi
            diff "$a/.kirakit-profile" "$b/.kirakit-profile" || [ ! -e "$a/.kirakit-profile" ]
            # The record of the permission rules, with a GitHub account (#67 R10).
            if [ -e "$a/.kirakit-permissions" ] || [ -e "$b/.kirakit-permissions" ]; then
              diff "$a/.kirakit-permissions" "$b/.kirakit-permissions"
            fi
          done
          test -f "$RUNNER_TEMP/ps-analyst/agents/iris.md"
          test -f "$RUNNER_TEMP/ps-analyst/output-styles/iris.md"
          test -f "$RUNNER_TEMP/ps-coder/agents/cleo.md"
          grep -qx 'model: sonnet' "$RUNNER_TEMP/ps-coder/agents/cleo.md"
          grep -qx 'agent: iris' "$RUNNER_TEMP/ps-analyst/skills/iris/SKILL.md"
          grep -qx 'agent: cleo' "$RUNNER_TEMP/ps-coder/skills/cleo/SKILL.md"
          grep -qx 'model: opus' "$RUNNER_TEMP/ps-analyst/agents/iris.md"
          test -f "$RUNNER_TEMP/ps-coder/output-styles/cleo.md"
          test ! -e "$RUNNER_TEMP/ps-analyst/agents/cleo.md"
          # The lead's review agent, only with a coder, by both installers (#183 R8).
          grep -qx 'model: opus' "$RUNNER_TEMP/ps-coder/agents/kira.md"
          # The read-only verification, only with the setting on, by both installers (#185 R4, R10).
          grep -qx 'skills: review-pr, review-spec' "$RUNNER_TEMP/ps-verified/agents/kira.md"
          grep -qx 'allowed-tools: Bash(gh issue view:\*)' "$RUNNER_TEMP/ps-verified/skills/review-spec/SKILL.md"
          for dir in sh ps sh-assistant ps-assistant sh-analyst ps-analyst sh-generic ps-generic sh-coder ps-coder; do
            test ! -e "$RUNNER_TEMP/$dir/skills/review-spec"
          done
          for dir in sh ps sh-assistant ps-assistant sh-analyst ps-analyst sh-generic ps-generic; do
            test ! -e "$RUNNER_TEMP/$dir/agents/kira.md"
          done
          # The members' permission rules are in the settings compared above (#67 R10).
          grep -qF '"Bash(GH_TOKEN=$(gh auth token --user kira-bot) gh issue create:*)",' "$RUNNER_TEMP/ps-assistant/settings.json"
          grep -qF '"Bash(GH_TOKEN=$(gh auth token --user iris-bot) gh project item-list:*)"' "$RUNNER_TEMP/ps-analyst/settings.json"
          grep -qF '"Bash(GH_TOKEN=$(gh auth token --user cleo-bot) gh pr edit:*)"' "$RUNNER_TEMP/ps-coder/settings.json"
          if grep -qF 'git push origin main' "$RUNNER_TEMP/ps-coder/settings.json"; then exit 1; fi
          # Her delete rules are narrowed to her work branches: none matches main (#79 D25).
          grep -qF '"Bash(git push origin --delete feat/:*)"' "$RUNNER_TEMP/ps-coder/settings.json"
          if grep -qF '"Bash(git push origin --delete:*)"' "$RUNNER_TEMP/ps-coder/settings.json"; then exit 1; fi
      - name: Permission rules in an existing settings.json
        # Both installers merge the rules into the same shapes, and leave the others unchanged.
        run: |
          shapes=$RUNNER_TEMP/shapes
          mkdir -p "$shapes"
          printf '{\n  "permissions": {\n    "allow": [],\n    "deny": []\n  }\n}\n' >"$shapes/empty.json"
          printf '{\n  "permissions": {\n    "allow": [\n    ]\n  }\n}\n' >"$shapes/empty-lines.json"
          printf '{\n  "keep": true,\n  "permissions": {\n    "allow": [\n      "Bash(make:*)",\n      "Bash(git push origin main)"\n    ],\n    "defaultMode": "auto"\n  }\n}\n' >"$shapes/mine.json"
          printf '{\n  "outputStyle": "Kira (cozy)",\n  "attribution": {"commit": "", "pr": ""},\n  "permissions": {"allow": ["Bash(make:*)"]}\n}\n' >"$shapes/unknown.json"
          for shape in empty empty-lines mine unknown; do
            for tool in sh ps; do
              dir=$RUNNER_TEMP/perm-$shape-$tool
              mkdir -p "$dir"
              cp "$shapes/$shape.json" "$dir/settings.json"
              if [ "$tool" = sh ]; then
                CLAUDE_CONFIG_DIR="$dir" sh get-kira.sh --copy --only claude --name Alex --gender male \
                  --language auto --assistant 'Kira <kira@example.com>' --assistant-github kira-bot \
                  --analyst-github iris-bot </dev/null >"$dir.log"
              else
                CLAUDE_CONFIG_DIR="$dir" pwsh -File get-kira.ps1 -Copy -Only claude -Name Alex -Gender male \
                  -Language auto -Assistant 'Kira <kira@example.com>' -AssistantGithub kira-bot \
                  -AnalystGithub iris-bot </dev/null >"$dir.log"
              fi
            done
            diff "$RUNNER_TEMP/perm-$shape-sh/settings.json" "$RUNNER_TEMP/perm-$shape-ps/settings.json"
            # The rules each installer reports, without its own paths.
            diff <(grep -E 'set permission|^  "Bash' "$RUNNER_TEMP/perm-$shape-sh.log" | sed 's/ in .*settings.json$//') \
              <(grep -E 'set permission|^  "Bash' "$RUNNER_TEMP/perm-$shape-ps.log" | sed 's/ in .*settings.json$//')
          done
          cmp "$shapes/unknown.json" "$RUNNER_TEMP/perm-unknown-ps/settings.json"
          grep -q 'warning: cannot add the permission rules' "$RUNNER_TEMP/perm-unknown-ps.log"
      - name: Permission rules recorded, updated and removed
        # Both installers keep the same settings.json and the same record through a series of
        # runs and hand edits (#67 R3, R7, R8, R10, R12 to R15).
        run: |
          # kira TOOL DIR ARGS: run one installer, with get-kira.sh options turned into
          # get-kira.ps1 parameters for the PowerShell one.
          kira() {
            tool=$1 dir=$2
            shift 2
            if [ "$tool" = sh ]; then
              CLAUDE_CONFIG_DIR="$dir" sh get-kira.sh "$@" </dev/null
              return
            fi
            set -- "$@" END
            while [ "$1" != END ]; do
              case $1 in
              --copy) set -- "$@" -Copy ;;
              --uninstall) set -- "$@" -Uninstall ;;
              --allow-releases) set -- "$@" -AllowReleases ;;
              --no-allow-releases) set -- "$@" -NoAllowReleases ;;
              --no-analyst) set -- "$@" -NoAnalyst ;;
              --only) set -- "$@" -Only "$2"; shift ;;
              --name) set -- "$@" -Name "$2"; shift ;;
              --gender) set -- "$@" -Gender "$2"; shift ;;
              --language) set -- "$@" -Language "$2"; shift ;;
              --assistant) set -- "$@" -Assistant "$2"; shift ;;
              --assistant-github) set -- "$@" -AssistantGithub "$2"; shift ;;
              --analyst-github) set -- "$@" -AnalystGithub "$2"; shift ;;
              --coder) set -- "$@" -Coder "$2"; shift ;;
              --coder-github) set -- "$@" -CoderGithub "$2"; shift ;;
              *) echo "::error::no PowerShell form for $1"; exit 1 ;;
              esac
              shift
            done
            shift
            CLAUDE_CONFIG_DIR="$dir" pwsh -File get-kira.ps1 "$@" </dev/null
          }
          # step NAME ARGS: run both installers, then compare their settings and records.
          step() {
            name=$1
            shift
            for tool in sh ps; do
              kira "$tool" "$RUNNER_TEMP/rec-$tool" "$@" >"$RUNNER_TEMP/rec-$tool.log"
            done
            diff "$RUNNER_TEMP/rec-sh/settings.json" "$RUNNER_TEMP/rec-ps/settings.json" ||
              { echo "::error::settings.json differs after: $name"; exit 1; }
            if [ -e "$RUNNER_TEMP/rec-sh/.kirakit-permissions" ] || [ -e "$RUNNER_TEMP/rec-ps/.kirakit-permissions" ]; then
              diff "$RUNNER_TEMP/rec-sh/.kirakit-permissions" "$RUNNER_TEMP/rec-ps/.kirakit-permissions" ||
                { echo "::error::record differs after: $name"; exit 1; }
            fi
            diff "$RUNNER_TEMP/rec-sh/.kirakit-profile" "$RUNNER_TEMP/rec-ps/.kirakit-profile" ||
              { echo "::error::profile differs after: $name"; exit 1; }
            # The rules each installer reports, without its own paths.
            diff <(grep -E 'permission|^  "Bash' "$RUNNER_TEMP/rec-sh.log" | sed "s|$RUNNER_TEMP/rec-sh|DIR|g") \
              <(grep -E 'permission|^  "Bash' "$RUNNER_TEMP/rec-ps.log" | sed "s|$RUNNER_TEMP/rec-ps|DIR|g") ||
              { echo "::error::reports differ after: $name"; exit 1; }
          }
          # edit COMMAND: apply the same hand edit, a filter, to both settings.json.
          edit() {
            for tool in sh ps; do
              "$@" <"$RUNNER_TEMP/rec-$tool/settings.json" >"$RUNNER_TEMP/edit.json"
              cat "$RUNNER_TEMP/edit.json" >"$RUNNER_TEMP/rec-$tool/settings.json"
            done
          }
          kira_rule='"Bash(GH_TOKEN=$(gh auth token --user kira-bot) gh issue create:*)"'
          for tool in sh ps; do
            mkdir -p "$RUNNER_TEMP/rec-$tool"
            # R12: a rule of the user's, identical to one of kirakit's.
            printf '{\n  "permissions": {\n    "allow": [\n      "Bash(make:*)",\n      "Bash(git push origin main)"\n    ]\n  }\n}\n' \
              >"$RUNNER_TEMP/rec-$tool/settings.json"
          done
          step install --copy --only claude --name Alex --gender male --language auto \
            --assistant 'Kira <kira@example.com>' --assistant-github kira-bot --analyst-github iris-bot
          step 'releases on' --copy --only claude --allow-releases
          grep -qF 'release create' "$RUNNER_TEMP/rec-ps/settings.json"
          step 'releases off' --copy --only claude --no-allow-releases
          if grep -qF 'release create' "$RUNNER_TEMP/rec-ps/settings.json"; then exit 1; fi
          # R13: a kirakit rule deleted by hand comes back.
          edit grep -vF "$kira_rule"
          step 'rule deleted by hand' --copy --only claude
          grep -qF "$kira_rule" "$RUNNER_TEMP/rec-ps/settings.json"
          # R14: a kirakit rule added a second time by hand.
          edit awk -v rule="$kira_rule" '{ print } /"allow": \[/ { print "      " rule "," }'
          step 'login changed' --copy --only claude --assistant-github kira-new
          test "$(grep -cF "$kira_rule" "$RUNNER_TEMP/rec-ps/settings.json")" = 1
          step 'shared rule' --copy --only claude --analyst-github kira-new
          step 'analyst removed' --copy --only claude --no-analyst
          grep -qF 'user kira-new) gh issue create' "$RUNNER_TEMP/rec-ps/settings.json"
          # #79 R25, R27: the coder's rules, and the lead's pr edit, come and go with her account.
          step 'coder added' --copy --only claude --coder 'Cleo <cleo@example.com>' --coder-github cleo-bot
          grep -qF 'user kira-new) gh pr edit' "$RUNNER_TEMP/rec-ps/settings.json"
          grep -qF 'user cleo-bot) gh pr edit' "$RUNNER_TEMP/rec-ps/settings.json"
          step 'coder account removed' --copy --only claude --coder-github ''
          if grep -qF -e 'user cleo-bot' -e 'gh pr edit' "$RUNNER_TEMP/rec-ps/settings.json"; then exit 1; fi
          # R15: an array on one line; removal is refused, the record kept.
          edit awk '/"allow": \[/ { line = $0; joined = 1; next }
            joined && /^ *\]/ { sub(/^ */, ""); print line $0; joined = 0; next }
            joined { sub(/^ */, ""); line = line $0; next }
            { print }'
          cp "$RUNNER_TEMP/rec-ps/settings.json" "$RUNNER_TEMP/one-line.json"
          step 'removal refused' --copy --only claude --assistant-github ''
          cmp "$RUNNER_TEMP/one-line.json" "$RUNNER_TEMP/rec-ps/settings.json"
          grep -q 'warning: cannot remove the permission rules' "$RUNNER_TEMP/rec-ps.log"
          test -s "$RUNNER_TEMP/rec-ps/.kirakit-permissions"
          step uninstall --uninstall
          test ! -e "$RUNNER_TEMP/rec-ps/.kirakit-permissions"
      - name: A member without a model
        # Both installers refuse to build a team member that declares no model (#97 R7).
        run: |
          src=$RUNNER_TEMP/no-model-src
          cp -r . "$src"
          sed -i '/^model: /d' "$src/team/iris.md"
          if CLAUDE_CONFIG_DIR="$RUNNER_TEMP/no-model-sh" sh "$src/get-kira.sh" --copy --name Alex \
            --gender male --language auto --analyst </dev/null 2>"$RUNNER_TEMP/no-model-sh.err"; then
            echo "::error::get-kira.sh built a member without a model"; exit 1
          fi
          grep -F 'iris.md: missing model' "$RUNNER_TEMP/no-model-sh.err"
          if CLAUDE_CONFIG_DIR="$RUNNER_TEMP/no-model-ps" pwsh -File "$src/get-kira.ps1" -Copy -Name Alex \
            -Gender male -Language auto -Analyst </dev/null 2>"$RUNNER_TEMP/no-model-ps.err"; then
            echo "::error::get-kira.ps1 built a member without a model"; exit 1
          fi
          grep -F 'iris.md: missing model' "$RUNNER_TEMP/no-model-ps.err"
      - name: Optional files
        # A template wholly inside a block that is dropped is neither built nor installed, and
        # is removed when an earlier run installed it, by both installers.
        run: |
          src=$RUNNER_TEMP/optional-src
          cp -r . "$src"
          printf '%s\n' '{{#assistant_github}}' '---' 'name: optional' '---' '' \
            'For {{assistant_github}}.' '{{/assistant_github}}' >"$src/claude/agents/optional.md"
          install() {
            if [ "$1" = sh ]; then
              CLAUDE_CONFIG_DIR="$2" sh "$src/get-kira.sh" --copy --name Alex --gender male \
                --language auto --assistant 'Kira <kira@example.com>' --assistant-github "$3" </dev/null
            else
              CLAUDE_CONFIG_DIR="$2" pwsh -File "$src/get-kira.ps1" -Copy -Name Alex -Gender male \
                -Language auto -Assistant 'Kira <kira@example.com>' -AssistantGithub "$3" </dev/null
            fi
          }
          for tool in sh ps; do
            dir=$RUNNER_TEMP/optional-$tool
            install "$tool" "$dir" kira-bot >/dev/null
            grep -qF 'For kira-bot.' "$dir/agents/optional.md"
            install "$tool" "$dir" '' >/dev/null
            if [ -e "$dir/agents/optional.md" ]; then echo "::error::$tool kept optional.md"; exit 1; fi
            if grep -q optional.md "$dir/.kirakit-manifest"; then echo "::error::$tool lists optional.md"; exit 1; fi
          done
          for path in output-styles skills rules CLAUDE.md agents; do
